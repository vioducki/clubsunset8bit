<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Sunset (Chiptune Cover)</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      --orange: #ff8a00;
      --djyellow: #ffd400;
      --white: #ffffff;
      --student: #5ecbf4;
      --blue: #3158a5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      color: var(--white);
      background:
        linear-gradient(135deg, rgba(255, 138, 0, 0.28), transparent 38%),
        linear-gradient(315deg, rgba(49, 88, 165, 0.38), transparent 42%),
        #3158a5;
    }

    main {
      width: min(960px, 100%);
      margin: 0 auto;
      overflow: hidden;
      border: 8px solid var(--white);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 18px 0 rgba(49, 88, 165, 0.38), 0 28px 55px rgba(22, 45, 91, 0.35);
    }

    header {
      position: relative;
      padding: 24px 28px 20px;
      background:
        linear-gradient(90deg, var(--orange), var(--djyellow) 34%, var(--white) 68%, var(--student));
      border-bottom: 5px solid var(--djyellow);
    }

    h1 {
      margin: 0;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(2.1rem, 7vw, 4rem);
      line-height: 0.95;
      color: var(--blue);
    }

    .page-grid {
      display: grid;
      padding: 18px;
      color: var(--blue);
      background-color: var(--white);
      background-image:
        linear-gradient(rgba(94, 203, 244, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(94, 203, 244, 0.08) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    article {
      border: 1px solid var(--student);
      border-radius: 10px;
      background: white;
      box-shadow: 0 4px 0 rgba(49, 88, 165, 0.12);
    }

    article { padding: 18px; }

    .track-banner {
      padding: 14px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--djyellow) 55%, var(--white) 100%);
      border: 1px solid var(--djyellow);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--blue);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0;
      color: var(--blue);
      font-size: 0.95rem;
    }

    .player {
      margin-top: 14px;
      padding: 16px 12px;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--student);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.85), transparent 35%),
        linear-gradient(135deg, var(--student), var(--blue));
      box-shadow: inset 0 2px 0 white;
      text-align: center;
    }

    .player iframe {
      display: block;
      width: min(384px, 100%);
      height: 60px;
      margin: 0 auto;
      border: 3px solid rgba(49, 88, 165, 0.65) !important;
      border-radius: 5px;
      background: #fff;
    }

    footer {
      padding: 12px 18px;
      color: white;
      background: linear-gradient(90deg, var(--student), var(--blue));
      border-top: 4px solid var(--student);
      font-size: 0.78rem;
      text-align: right;
    }

    @media (max-width: 680px) {
      body { padding: 10px; }
      main { border-width: 5px; }
      header { padding: 20px 16px 16px; }
    }
  </style>
</head>
